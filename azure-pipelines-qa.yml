# Docker
# Build and push an image to Azure Container Registry
# https://docs.microsoft.com/azure/devops/pipelines/languages/docker

trigger:
- main

resources:
- repo: self

variables:
  # Container registry service connection established during pipeline creation
  dockerRegistryServiceConnection: '828744d5-4e9f-4fdc-947b-9801173b58cf'
  imageRepository: 'missions'
  containerRegistry: 'missionspoccontainer.azurecr.io'
  dockerfilePath: '$(Build.SourcesDirectory)/Dockerfile'
  tag: '$(Build.BuildId)'

  # ── deploy target ────────────────────────────────────────────────────
  # The Container App that serves QA. It pulls from the registry above, so the
  # only thing a release does is point it at the image this run just built.
  containerAppName: 'missionspoccontainer'
  containerAppResourceGroup: 'rg-missions-qa'
  # The RG was moved to its own subscription and renamed on 2026-08-24. Naming
  # the subscription explicitly means a service connection scoped elsewhere
  # fails loudly here instead of updating something else.
  azureSubscriptionId: '714d8f95-f2fa-4b06-942e-fb76ffb6d213'   # "Misssions"
  healthUrl: 'https://missionspoccontainer.kindwave-29864c84.westeurope.azurecontainerapps.io/api/status'

  # ARM service connection for the deploy stage. It reuses the SAME service
  # principal that already backs the registry connection above, via workload
  # identity federation — no new app registration, no client secret anywhere.
  azureServiceConnection: 'Missions-QA-ARM'

  # Agent VM image name
  vmImageName: 'ubuntu-latest'

stages:
- stage: Build
  displayName: Build and push stage
  jobs:
  - job: Build
    displayName: Build
    pool:
      vmImage: $(vmImageName)
    steps:
    - task: Docker@2
      displayName: Build and push an image to container registry
      inputs:
        command: buildAndPush
        repository: $(imageRepository)
        dockerfile: $(dockerfilePath)
        containerRegistry: $(dockerRegistryServiceConnection)
        tags: |
          $(tag)

- stage: Deploy
  displayName: Deploy to the QA Container App
  dependsOn: Build
  condition: succeeded()
  jobs:
  - job: Deploy
    displayName: Roll the Container App onto the image this run built
    pool:
      vmImage: $(vmImageName)
    steps:
    - task: AzureCLI@2
      displayName: az containerapp update + wait for the revision to serve
      inputs:
        azureSubscription: $(azureServiceConnection)
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
          set -euo pipefail
          # `containerapp` is a CLI extension and a hosted agent starts clean.
          # Without this the install prompt blocks and the job hangs to timeout.
          az config set extension.use_dynamic_install=yes_without_prompt

          IMAGE="$(containerRegistry)/$(imageRepository):$(tag)"
          echo "── deploying $IMAGE ──"

          # Deliberately the build-id tag, never :latest. A Container App creates
          # a new revision only when the image STRING changes, so deploying
          # :latest twice is a silent no-op: the pipeline goes green and the old
          # container keeps serving. A unique tag per run makes that impossible,
          # and makes the running revision say exactly what code it is.
          COMMON=(--subscription "$(azureSubscriptionId)"
                  --resource-group "$(containerAppResourceGroup)"
                  --name "$(containerAppName)")
          az containerapp update "${COMMON[@]}" --image "$IMAGE" --output none

          REV=$(az containerapp show "${COMMON[@]}" \
                  --query "properties.latestRevisionName" -o tsv)
          echo "── new revision: $REV ──"

          # Provisioning plus the traffic shift takes minutes, not seconds. The
          # first version of this polled HTTP for two minutes and failed a deploy
          # that had in fact succeeded — so wait on the revision's own state
          # first, which says WHY if it never comes up.
          for i in $(seq 1 60); do
            read -r RUNNING HEALTH < <(az containerapp revision show "${COMMON[@]}" \
              --revision "$REV" \
              --query "[properties.runningState, properties.healthState]" -o tsv)
            echo "  [$i] running=$RUNNING health=$HEALTH"
            case "$RUNNING" in
              Running)  break ;;
              Failed|Degraded)
                echo "##vso[task.logissue type=error]revision $REV came up $RUNNING"
                az containerapp logs show "${COMMON[@]}" --revision "$REV" --tail 60 || true
                exit 1 ;;
            esac
            sleep 10
          done

          # Only now is an HTTP check meaningful: the revision is up and holds
          # the traffic, so a non-200 is the app failing, not the platform.
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "$(healthUrl)" || echo 000)
            echo "  health attempt $i → HTTP $code"
            if [ "$code" = "200" ]; then
              echo "✅ $REV serving $IMAGE"
              exit 0
            fi
            sleep 10
          done
          echo "##vso[task.logissue type=error]$REV never returned 200 — rolling back is manual"
          az containerapp logs show "${COMMON[@]}" --revision "$REV" --tail 60 || true
          exit 1
