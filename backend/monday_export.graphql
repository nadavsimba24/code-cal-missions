# The query the importer reads, for the migration off monday.com.
#
# Everything the board is comes from here, so a field left out is a field the
# import cannot invent: without `name` the board arrives under the file's name,
# without `groups` / `group` every item lands in one unnamed group, and without
# `subitems` the children stay behind. `column_values` carries each cell's type,
# which is the whole reason for migrating from the JSON rather than from an
# Excel export of the same board — an xlsx has lost the types by the time it is
# written, and the import would be guessing at every column.
#
# `updates` is the item's conversation, and it is asked for on the items and on
# their sub-items alike: the messages are most of what happened on a board, and
# a migration that brings the cells without them arrives with the decisions and
# none of the reasoning behind them. `text_body` is asked for beside `body`
# because the body is HTML — the plain text is what a reader should get.
#
# `color` on a group is the colour of its header on the board — the thing people
# recognise a group by before they have read its name. monday answers it as a
# hex string, and without it the import has to invent one: the groups arrive in
# a palette of this app's own, and a board whose "דחוף" was red comes across
# green. It is one word in the query and it is the whole of that.
#
# `columns` is where a formula column's expression lives. Without it the computed
# values still arrive (see FormulaValue below) but the formula itself does not,
# and a migrated board has a column of frozen numbers nobody can adjust.
#
# ⚠ ONE of the two queries below goes into a request — never this file whole.
# They are two operations, and a request carrying both comes back HTTP 200 with
#
#     "operation name is required when multiple operations are defined"
#
# because a document holding two operations needs an operationName to say which
# one to run, and Postman's GraphQL body does not send one. That is also why
# they are kept separate and complete rather than sharing a fragment.
#
# Two things make this trap easy to walk into. Postman's query box APPENDS what
# is pasted into it rather than replacing it, so a box that already held one
# query ends up holding two — clear it first (⌘A, delete). And the box scrolls,
# so a second operation can sit below the visible lines and look deleted. The
# collection beside this file is the way around both: its two requests each hold
# one operation already, and neither can pick up the other's text.
#
# limit is 500, monday's maximum. A board longer than that answers with a cursor
# instead of null: run the second query with it, again and again, until the
# cursor comes back null. Then put the responses in one file, as a JSON array —
#
#     [ {first response}, {second}, {third} ]
#
# — and import that file. The pages are read as the one board they are. An
# import whose last page still has a cursor says so in the report, rather than
# quietly building half a board and leaving it to be discovered by counting.

# ── page one ────────────────────────────────────────────────────────────────
# variables: { "boardId": [6204255781] }
query ($boardId: [ID!]) {
  # The account's users. A people CELL carries monday's person id and the
  # activity log carries only a user id — neither is a name, and this is the one
  # thing that turns either into one. Without it a people column can only be
  # matched by display name, and every log row reads "מערכת".
  #
  # The limit is not decoration. Asked bare, `users` answers with monday's
  # default page of 200 and says nothing about the rest — on this account that
  # is 200 of 318, and the 118 it leaves out are ordinary named people with
  # ordinary company addresses. They came back from an import as "could not be
  # matched", which reads like they are not in the system rather than like the
  # export never asked about them.
  users(limit: 1000) {
    id
    name
    email
  }

  boards(ids: $boardId) {
    id
    name
    # How many items the board holds, against the 500 that fit in one page. It
    # is what turns "did everything come?" into arithmetic instead of a feeling:
    # 687 against 500 says a second request is needed before the first response
    # is even read, and it is the number the pages are counted back against.
    #
    # It is read by the importer now, which it was not: the field came across in
    # the file and nothing compared it to anything. A merged file of 2,000 items
    # out of a 2,069-item board imported as a board of 2,000, and the gap was
    # found by counting one group in monday a day later. The report states both
    # numbers — see items_expected / items_missing in import_monday.parse.
    items_count

    groups { id title color }
    # The board's own column definitions. Two things live ONLY here — the copy of
    # a column that rides inside every item carries its title and type and
    # nothing else — and `settings_str` is the JSON holding both.
    #
    # A formula, as the expression itself:
    #   {"formula": "{numeric_mkl3sp} + 5"}   (references are column IDs)
    # and a status column's vocabulary, as the words beside their colours:
    #   {"labels": {"0": "בעבודה", "1": "הושלם"},
    #    "labels_colors": {"0": {"color": "#fdab3d"}, "1": {"color": "#00c875"}}}
    # Without this line every status arrives in a colour of this app's choosing,
    # cycled by position — so "הושלם" comes across red as often as green, and
    # the board can no longer be read at a glance the way it could in monday.
    # It is the deprecated spelling of the typed `settings` object, and it is
    # asked for deliberately: it exists in every API version this export runs
    # against, while `settings` does not. The importer reads either shape.
    columns { id title type settings_str }
    items_page(limit: 500) {
      cursor
      items {
        id
        name
        group { id title color }
        column_values {
          id
          type
          column { title }
          text
          value
          ... on FileValue { files { ... on FileAssetValue { asset_id } } }
          # Three types do not answer in `text` at all, and asking only for it
          # is what made them arrive empty on every single item:
          #   board_relation — "the text and value fields always return null"
          #   mirror         — the mirrored content lives in display_value
          #   formula        — "the computed result is returned in display_value;
          #                     the text and value fields are not populated"
          ... on BoardRelationValue { display_value linked_item_ids linked_items { id name } }
          ... on MirrorValue { display_value }
          # ⚠ monday allows at most FIVE formula columns per request (and 10,000
          # formula values a minute). A board with more than five gets an error or
          # empty strings back: export it twice, each run naming a different set
          # of column `ids`, or drop this line and accept that the formulas —
          # which are computed, never stored — do not come across.
          ... on FormulaValue { display_value }
        }
        assets { id name public_url }
        subitems {
          id
          name
          column_values {
            id type column { title } text value
            ... on FileValue { files { ... on FileAssetValue { asset_id } } }
            ... on BoardRelationValue { display_value linked_item_ids linked_items { id name } }
            ... on MirrorValue { display_value }
            ... on FormulaValue { display_value }
          }
          # A file cell names its asset, and the asset — its real name and the link
          # that can actually be fetched — is carried by the ROW the cell sits on.
          # Asked for on the items and not on their sub-items, every file attached to
          # a sub-item arrived as a bare name with nothing behind it.
          assets { id name public_url }
          updates {
            id body text_body created_at
            creator { name email }
            replies { id body text_body created_at creator { name email } assets { id name public_url } }
            assets { id name public_url }
          }
        }
        updates {
          id body text_body created_at
          creator { name email }
          replies { id body text_body created_at creator { name email } assets { id name public_url } }
          assets { id name public_url }
        }
      }
    }
  }
}

# ── the history, as a request of its own ────────────────────────────────────
# The board's activity log: who changed what, when.
#
# A request of its own because asking for it beside 500 items does not fit: a
# 320-item board came back REQUEST_MAX_COMPLEXITY_EXCEEDED, cost 5,125,801
# against monday's ceiling of 5,000,000. Nothing is lost by splitting it — the
# import reads a file holding SEVERAL responses as the one board they describe,
# and takes the log from whichever of them carries it. Put both responses in one
# file, as a JSON array:
#
#     [ {the items response}, {the history response} ]
#
# `users` is asked for here too, and for the reason it is asked for above: the
# log names a person only by their monday user id, and without this every row
# would read "מערכת".
#
# The log pages by `page`, and there is NO count for it — no `activity_logs_count`
# the way the board has `items_count`. So how many entries the board holds is
# only knowable by asking for a page, adding it up, and asking for the next: a
# page that comes back short of the limit is the end, and nothing before that
# says how far away the end is. `page` is a variable for exactly that reason —
# the collection walks it and keeps the tally, so the number arrives without
# anyone editing the query between runs.
#
# If a page is refused for complexity, halve the limit; the walk is unchanged.
# The report says how many entries came and the date the log starts at, which is
# how you know a page is missing. monday keeps activity logs for a window that
# depends on the plan, so what arrives is what is still there, never the whole
# life of the board.
#
# ⚠ The variable matters here as much as the query. `boards(ids: $boardId)` run
# with boardId unset is `boards(ids: null)`, and monday answers that with the
# first page of EVERY board in the account — twenty-six boards' logs instead of
# this one's. It happens to this request and not to the first because it is run
# second, in a fresh tab or a request whose variables were never filled in. The
# import survives it now: the items settle which board the file is about, the
# other boards are named in the report and their history is left behind. Setting
# the variable is still the point — the log that was asked for is this board's.
# variables: { "boardId": [6204255781], "page": 1 }
query ($boardId: [ID!], $page: Int!) {
  # limit: see the first query — bare, this answers with 200 of 318
  users(limit: 1000) {
    id
    name
    email
  }

  boards(ids: $boardId) {
    id
    activity_logs(limit: 10000, page: $page) {
      id
      event
      data
      user_id
      created_at
    }
  }
}

# ── every page after it ─────────────────────────────────────────────────────
# variables: { "cursor": "<the cursor the previous response returned>" }
query ($cursor: String!) {
  next_items_page(limit: 500, cursor: $cursor) {
    cursor
    items {
      id
      name
      group { id title color }
      column_values {
        id
        type
        column { title }
        text
        value
        ... on FileValue { files { ... on FileAssetValue { asset_id } } }
        # Three types do not answer in `text` at all, and asking only for it
        # is what made them arrive empty on every single item:
        #   board_relation — "the text and value fields always return null"
        #   mirror         — the mirrored content lives in display_value
        #   formula        — "the computed result is returned in display_value;
        #                     the text and value fields are not populated"
        ... on BoardRelationValue { display_value linked_item_ids linked_items { id name } }
        ... on MirrorValue { display_value }
        # ⚠ monday allows at most FIVE formula columns per request (and 10,000
        # formula values a minute). A board with more than five gets an error or
        # empty strings back: export it twice, each run naming a different set
        # of column `ids`, or drop this line and accept that the formulas —
        # which are computed, never stored — do not come across.
        ... on FormulaValue { display_value }
      }
      assets { id name public_url }
      subitems {
        id
        name
        column_values {
          id type column { title } text value
          ... on FileValue { files { ... on FileAssetValue { asset_id } } }
          ... on BoardRelationValue { display_value linked_item_ids linked_items { id name } }
          ... on MirrorValue { display_value }
          ... on FormulaValue { display_value }
        }
        # A file cell names its asset, and the asset — its real name and the link
        # that can actually be fetched — is carried by the ROW the cell sits on.
        # Asked for on the items and not on their sub-items, every file attached to
        # a sub-item arrived as a bare name with nothing behind it.
        assets { id name public_url }
        updates {
          id body text_body created_at
          creator { name email }
          replies { id body text_body created_at creator { name email } assets { id name public_url } }
          assets { id name public_url }
        }
      }
      updates {
        id body text_body created_at
        creator { name email }
        replies { id body text_body created_at creator { name email } assets { id name public_url } }
        assets { id name public_url }
      }
    }
  }
}
