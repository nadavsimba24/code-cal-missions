# Docker
# Build an image, push it to the production ACR, and roll the production
# Web App onto it.
# https://docs.microsoft.com/azure/devops/pipelines/languages/docker

# Manual only. Every commit to main goes to QA automatically (see
# azure-pipelines-qa.yml); production is a deliberate act, so this pipeline is
# started by hand from the Run pipeline button.
trigger: none

resources:
- repo: self

variables:
  # Container registry service connection established during pipeline creation
  dockerRegistryServiceConnection: 'c421a383-83d6-4d5e-8434-0e9be1e276d5'
  imageRepository: 'missions'
  containerRegistry: 'missionsprdacr.azurecr.io'
  registryName: 'missionsprdacr'
  dockerfilePath: '$(Build.SourcesDirectory)/Dockerfile'
  tag: '$(Build.BuildId)'

  # Deploy target
  webAppName: 'Missions-Prd-Webapp'
  webAppResourceGroup: 'RG-Missions-PRD'
  siteContainerName: 'Missions'
  siteContainerPort: '8000'
  healthCheckPath: '/api/status'
  azureSubscriptionId: '714d8f95-f2fa-4b06-942e-fb76ffb6d213'
  azureServiceConnection: 'Missions-PROD-ARM'

  # Agent VM image
  vmImageName: 'ubuntu-latest'

stages:
- stage: Build
  displayName: Security scan, build and push
  jobs:
  - job: Build
    displayName: Scan source, then build image
    pool:
      vmImage: $(vmImageName)
    steps:
    # Download the Linux Mend CLI into the checked-out repository directory.
    - task: Bash@3
      displayName: 'Download Mend CLI'
      inputs:
        targetType: 'inline'
        workingDirectory: '$(Build.SourcesDirectory)'
        script: |
          set -euo pipefail
          curl -fsSL -o mend https://downloads.mend.io/cli/linux_amd64/mend
          chmod +x mend
          ./mend version

    # These variables must be created in the pipeline/library; mark MEND_USER_KEY secret.
    - task: Bash@3
      displayName: 'Mend dependencies scan (SCA) - Production'
      inputs:
        targetType: 'inline'
        workingDirectory: '$(Build.SourcesDirectory)'
        script: |
          set -euo pipefail
          ./mend dep \
            --scope "Missions//Missions-Prod" \
            --update \
            --reachability
      env:
        MEND_EMAIL: $(MENDEMAIL)
        MEND_USER_KEY: $(MEND_USER_KEY)
        MEND_URL: $(MENDURL)

    - task: Bash@3
      displayName: 'Mend code scan (SAST)  - Production'
      inputs:
        targetType: 'inline'
        workingDirectory: '$(Build.SourcesDirectory)'
        script: |
          set -euo pipefail
          ./mend code \
            --scope "Missions//Missions-Prod"
      env:
        MEND_EMAIL: $(MENDEMAIL)
        MEND_USER_KEY: $(MEND_USER_KEY)
        MEND_URL: $(MENDURL)

    # Docker build/push only starts if the preceding Mend tasks succeed.
    #
    # The registry login goes through the ARM connection, not the Docker
    # registry service connection. That connection held a client secret, and
    # on 2026-11-23 it failed release run 51601 at this step with "Invalid
    # clientid or client secret" — the same expiry that stopped QA on
    # 2026-11-22 (fixed there in 31092d7). Missions-PROD-ARM uses workload
    # identity federation, so it has no secret to expire, and the Deploy stage
    # already reaches this registry through it.
    - task: AzureCLI@2
      displayName: Build and push an image to container registry
      inputs:
        azureSubscription: $(azureServiceConnection)
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
          set -euo pipefail
          az acr login -n "$(registryName)"
          IMAGE="$(containerRegistry)/$(imageRepository):$(tag)"
          docker build -f "$(dockerfilePath)" -t "$IMAGE" "$(Build.SourcesDirectory)"
          docker push "$IMAGE"

- stage: Deploy
  displayName: Deploy to the production Web App
  dependsOn: Build
  condition: succeeded()
  jobs:
  - job: Deploy
    displayName: Roll production onto the image this run built
    pool:
      vmImage: $(vmImageName)
    steps:
    - task: AzureCLI@2
      displayName: Point the site container at the new image, restart, verify
      inputs:
        azureSubscription: $(azureServiceConnection)
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
          set -euo pipefail

          RG="$(webAppResourceGroup)"
          APP="$(webAppName)"
          CONTAINER="$(siteContainerName)"
          if [ -z "$RG" ] || [ -z "$APP" ]; then
            echo "##vso[task.logissue type=error]webAppResourceGroup / webAppName are not set — refusing to guess at a production target"
            exit 1
          fi

          COMMON=(--subscription "$(azureSubscriptionId)"
                  --resource-group "$RG"
                  --name "$APP")

          IMAGE="$(containerRegistry)/$(imageRepository):$(tag)"

          # Record the currently configured image for troubleshooting/rollback.
          PREV=$(az webapp sitecontainers list "${COMMON[@]}" \
                   --query "[?name=='$CONTAINER'].image | [0]" -o tsv)
          if [ -z "$PREV" ]; then
            echo "##vso[task.logissue type=error]no site container named '$CONTAINER' on $APP — check siteContainerName"
            az webapp sitecontainers list "${COMMON[@]}" --query "[].name" -o tsv || true
            exit 1
          fi

          HOST=$(az webapp show "${COMMON[@]}" --query defaultHostName -o tsv)
          HOSTS=$(az webapp show "${COMMON[@]}" --query "hostNames" -o tsv)
          REDIRECT_URIS=$(for h in $HOSTS; do printf 'https://%s/auth/callback,' "$h"; done | sed 's/,$//')

          echo "── current  : $PREV"
          echo "── deploying: $IMAGE"
          echo "── host     : https://$HOST"
          echo "── redirects: $REDIRECT_URIS"

          # The site container currently uses ACR credentials; fetch them at deploy time.
          ACR_USER=$(az acr credential show -n "$(registryName)" \
                       --subscription "$(azureSubscriptionId)" --query username -o tsv)
          ACR_PASS=$(az acr credential show -n "$(registryName)" \
                       --subscription "$(azureSubscriptionId)" --query "passwords[0].value" -o tsv)

          az webapp sitecontainers update "${COMMON[@]}" \
            --container-name "$CONTAINER" \
            --image "$IMAGE" \
            --target-port "$(siteContainerPort)" \
            --is-main true \
            --registry-username "$ACR_USER" \
            --registry-password "$ACR_PASS" \
            --output none

          az webapp config appsettings set "${COMMON[@]}" --settings \
            MISSIONS_IMAGE_TAG="$(tag)" \
            CITYOS_AUTH_MODE="entra" \
            WEBSITES_CONTAINER_START_TIME_LIMIT="1800" \
            ENTRA_REDIRECT_URI="$REDIRECT_URIS" \
            --output none

          az webapp config set "${COMMON[@]}" \
            --generic-configurations "{\"healthCheckPath\": \"$(healthCheckPath)\"}" \
            --output none

          # If the site is deny-by-default, temporarily allow this hosted agent for verification.
          RULE=""
          cleanup() {
            [ -n "$RULE" ] || return 0
            echo "── removing the temporary allow rule $RULE"
            az webapp config access-restriction remove "${COMMON[@]}" \
              --rule-name "$RULE" --output none || \
              echo "##vso[task.logissue type=warning]could not remove $RULE — remove it by hand"
          }
          trap cleanup EXIT

          DEFAULT_ACTION=$(az webapp config access-restriction show "${COMMON[@]}" \
                             --query ipSecurityRestrictionsDefaultAction -o tsv 2>/dev/null || true)
          if [ "$DEFAULT_ACTION" = "Deny" ]; then
            for stale in $(az webapp config access-restriction show "${COMMON[@]}" \
                             --query "ipSecurityRestrictions[?name != null] | [?starts_with(name, 'pipeline-verify-')].name" \
                             -o tsv 2>/dev/null || true); do
              echo "── removing a leftover rule from an earlier run: $stale"
              az webapp config access-restriction remove "${COMMON[@]}" \
                --rule-name "$stale" --output none || true
            done

            AGENT_IP=$(curl -fsS --max-time 10 https://api.ipify.org 2>/dev/null || true)
            if [ -n "$AGENT_IP" ]; then
              RULE="pipeline-verify-$(tag)"
              echo "── allow-list is deny-by-default; letting the agent ($AGENT_IP) in as $RULE"
              # ⚠ A rule's description may not contain a comma or a semicolon.
              # That was the whole of a six-week run of releases reported
              # failed: the description read "temporary, added and removed by
              # build <id>", App Service refused it saying only "Bad Request"
              # with no field named, the rule was never added, and the check
              # below then spent thirty minutes being turned away by the
              # allow-list this step had just failed to put the agent on. Every
              # one of those releases had deployed correctly. Fixed once in
              # f4bdd87, lost when this file was rewritten in the web editor
              # (ba0bbc4), fixed again on the release branch in a4e9e9a and
              # lost again the same way (d8e72a1). Do not reintroduce the comma.
              az webapp config access-restriction add "${COMMON[@]}" \
                --rule-name "$RULE" --priority 100 --action Allow \
                --ip-address "$AGENT_IP/32" \
                --description "temporary - added and removed by build $(tag)" \
                --output none || {
                  RULE=""
                  echo "##vso[task.logissue type=warning]could not add the allow rule — the check below will see 403"
                }
            else
              echo "##vso[task.logissue type=warning]could not learn the agent's own address — the check below will see 403"
            fi
          fi

          az webapp restart "${COMMON[@]}" --output none
          echo "── restarted, waiting for $(tag) to answer"

          refused=0
          for i in $(seq 1 120); do
            resp=$(curl -sS --max-time 10 -w '\n%{http_code}' \
                     "https://$HOST/api/status" 2>/dev/null || true)
            code=${resp##*$'\n'}
            body=${resp%$'\n'*}
            [ "$body" = "$code" ] && body=""
            running=$(printf '%s' "$body" | python3 -c \
              'import json,sys; print(json.load(sys.stdin).get("image_tag",""))' 2>/dev/null || true)

            case "${code:-000}:${running:-}" in
              "200:$(tag)") state="$running" ;;
              200:)         state="<200, but no image_tag — is this our app?>" ;;
              200:*)        state="$running  ← STILL THE OLD IMAGE" ;;
              403:*)        state="<403 refused — the agent is not on the allow-list>"
                            refused=$((refused + 1)) ;;
              000:*)        state="<still starting>" ;;
              *)            state="<http $code>" ;;
            esac
            echo "  [$i/120] serving=$state"
            if [ "$running" = "$(tag)" ]; then
              mode=$(printf '%s' "$body" | python3 -c \
                'import json,sys; print(json.load(sys.stdin).get("auth_mode",""))' 2>/dev/null || true)
              echo "✅ https://$HOST is serving $IMAGE (auth_mode=$mode)"
              if [ "$mode" != "entra" ]; then
                echo "##vso[task.logissue type=warning]auth_mode is '$mode', expected 'entra' — sign-in may fail"
              fi
              exit 0
            fi
            sleep 15
          done

          CONFIGURED=$(az webapp sitecontainers list "${COMMON[@]}" \
                         --query "[?name=='$CONTAINER'].image | [0]" -o tsv)
          echo "##vso[task.logissue type=error]$HOST never reported image_tag=$(tag) within 30 minutes"
          if [ "$refused" -gt 0 ]; then
            echo "$refused of the attempts were refused with 403. The agent was not"
            echo "let through the allow-list on $APP, so this run proves nothing"
            echo "about what production is serving — check it from an address that"
            echo "is on the list before touching anything."
          fi
          if [ "$CONFIGURED" = "$IMAGE" ]; then
            echo "The site container IS pointed at $IMAGE — the image was deployed"
            echo "and the app did not answer in time. Check the logs below before"
            echo "rolling back: it may still be starting."
          else
            echo "The site container is on $CONFIGURED, not $IMAGE — the deploy"
            echo "itself did not take."
          fi
          timeout 45 az webapp log tail "${COMMON[@]}" || true
          echo "roll back with:"
          echo "  az webapp sitecontainers update ${COMMON[*]} --container-name $CONTAINER --image $PREV --target-port $(siteContainerPort) --is-main true --registry-username <acr-user> --registry-password <acr-pass>"
          echo "  az webapp restart ${COMMON[*]}"
          exit 1
