<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 | Missions</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='%230073ea'/><stop offset='1' stop-color='%2300c875'/></linearGradient></defs><rect width='64' height='64' rx='14' fill='url(%23g)'/><path d='M15 33 L49 16 L39 49 L32 38 Z' fill='white'/><path d='M32 38 L39 49 L30 45 Z' fill='%23d6ecff'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=Rubik:wght@400;500;600;700;800&family=Heebo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
:root{
  --bg:#f6f7fb; --surface:#fff; --text:#323338; --text-muted:#676879; --text-light:#9699a6;
  --border:#e6e9ef; --border-strong:#d0d4e4; --row-hover:#f5f6f8;
  --primary:#0073ea; --primary-hover:#0060b9; --primary-soft:#cce5ff;
  --green:#00c875; --orange:#fdab3d; --red:#e2445c; --blue:#579bfc;
  --sidebar-w:240px; --header-h:48px; --radius:8px;
  --shadow:0 4px 16px rgba(29,42,68,.12);
  --font:'Figtree','Rubik','Heebo','Segoe UI',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#12141c; --surface:#1b1e27; --text:#e6e8ef; --text-muted:#9aa0b0; --text-light:#6b7080;
    --border:#2a2e3a; --border-strong:#3a3f4d; --row-hover:#232733; --primary-soft:#1e3050;
    --shadow:0 6px 22px rgba(0,0,0,.45);
  }
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:var(--font);background:var(--bg);color:var(--text);direction:rtl;overflow:hidden;font-size:14px}
button,a{font-family:inherit}
.app{display:flex;height:100vh;min-height:100vh}
.sidebar{width:var(--sidebar-w);min-width:var(--sidebar-w);background:var(--surface);border-left:1px solid var(--border);display:flex;flex-direction:column}
.logo{height:var(--header-h);display:flex;align-items:center;gap:10px;padding:0 16px;border-bottom:1px solid var(--border);font-weight:800;font-size:17px}
.logo-dot{width:26px;height:26px;border-radius:7px;background:linear-gradient(135deg,#0073ea,#00c875);display:grid;place-items:center;color:#fff;font-size:13px}
.sb-list{padding:0 8px;display:flex;flex-direction:column;gap:2px}
.sb-item{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:6px;color:var(--text);text-decoration:none;white-space:nowrap;overflow:hidden}
.sb-item:hover{background:var(--row-hover)}
.sb-item.active{background:var(--primary-soft);color:var(--primary-hover);font-weight:700}
.sb-item i{width:22px;text-align:center;font-size:15px}
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.appbar{height:var(--header-h);background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:14px;padding:0 16px}
.ab-title{font-weight:700;font-size:15px;display:flex;align-items:center;gap:8px}
.ab-spacer{flex:1}
.icon-btn{width:34px;height:34px;border-radius:7px;display:grid;place-items:center;color:var(--text-muted);font-size:15px;text-decoration:none}
.icon-btn:hover{background:var(--row-hover);color:var(--text)}
.content{flex:1;display:grid;place-items:center;padding:32px;overflow:auto}
.not-found{width:min(920px,100%);display:grid;grid-template-columns:minmax(260px,1fr) 300px;gap:32px;align-items:center}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:28px}
.eyebrow{display:inline-flex;align-items:center;gap:7px;color:var(--primary-hover);background:var(--primary-soft);border-radius:999px;padding:6px 11px;font-size:12px;font-weight:800;margin-bottom:14px}
h1{font-size:34px;line-height:1.15;margin:0 0 10px;font-weight:800;letter-spacing:0}
.copy{color:var(--text-muted);font-size:15px;line-height:1.65;margin:0 0 22px;max-width:560px}
.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:36px;padding:0 15px;border-radius:7px;text-decoration:none;font-weight:700;font-size:13px;border:1px solid transparent}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-hover)}
.btn-ghost{color:var(--text-muted);border-color:var(--border-strong);background:var(--surface)}
.btn-ghost:hover{background:var(--row-hover);color:var(--text)}
.board-preview{display:grid;gap:10px}
.mini-toolbar{display:flex;gap:7px;align-items:center;margin-bottom:2px}
.mini-dot{width:9px;height:9px;border-radius:50%;background:var(--green)}
.mini-line{height:8px;border-radius:5px;background:var(--border);flex:1}
.mini-row{display:grid;grid-template-columns:12px 1fr 54px;gap:8px;align-items:center;border:1px solid var(--border);border-radius:6px;padding:9px;background:var(--surface)}
.status{width:12px;height:12px;border-radius:3px}
.status.blue{background:var(--blue)} .status.orange{background:var(--orange)} .status.red{background:var(--red)}
.row-text{height:9px;border-radius:5px;background:var(--row-hover)}
.pill{height:18px;border-radius:5px;background:var(--primary-soft)}
.big-404{font-size:74px;line-height:.9;font-weight:800;color:var(--primary);letter-spacing:0;margin:2px 0 14px;text-align:left}
.caption{color:var(--text-light);font-size:12px;text-align:left;font-weight:700}
@media (max-width:820px){
  body{overflow:auto}
  .app{min-height:100vh;height:auto}
  .sidebar{display:none}
  .not-found{grid-template-columns:1fr;gap:18px}
  .content{padding:20px}
  h1{font-size:28px}
  .big-404{text-align:right;font-size:62px}
  .caption{text-align:right}
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" aria-hidden="true">
    <div class="logo"><span class="logo-dot"><i class="fa-solid fa-location-arrow"></i></span><span>Missions</span></div>
  </aside>
  <main class="main">
    <header class="appbar">
      <div class="ab-title"><i class="fa-regular fa-circle-question"></i><span>עמוד לא נמצא</span></div>
      <div class="ab-spacer"></div>
      <a class="icon-btn" href="/" aria-label="חזרה לבית"><i class="fa-solid fa-house"></i></a>
    </header>
    <section class="content">
      <div class="not-found">
        <div class="panel">
          <div class="eyebrow"><i class="fa-solid fa-triangle-exclamation"></i><span>שגיאה 404</span></div>
          <h1>העמוד שחיפשת לא נמצא</h1>
          <p class="copy">יכול להיות שהקישור השתנה, שהעמוד נמחק, או שאין לך גישה אליו. אפשר לחזור ללוח הראשי ולהמשיך משם.</p>
          <div class="actions">
            <a class="btn btn-primary" href="/"><i class="fa-solid fa-arrow-right"></i><span>חזרה למערכת</span></a>
            <a class="btn btn-ghost" href="javascript:history.back()"><i class="fa-solid fa-rotate-left"></i><span>חזרה אחורה</span></a>
          </div>
        </div>
        <div class="panel board-preview" aria-hidden="true">
          <div class="big-404">404</div>
          <div class="mini-toolbar"><span class="mini-dot"></span><span class="mini-line"></span><span class="mini-line"></span></div>
          <div class="mini-row"><span class="status blue"></span><span class="row-text"></span><span class="pill"></span></div>
          <div class="mini-row"><span class="status orange"></span><span class="row-text"></span><span class="pill"></span></div>
          <div class="mini-row"><span class="status red"></span><span class="row-text"></span><span class="pill"></span></div>
          <div class="caption">הנתיב לא קיים בלוח</div>
        </div>
      </div>
    </section>
  </main>
</div>
</body>
</html>
